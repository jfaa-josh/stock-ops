name: CI

'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      # Set optional tokens, if not exist, defaults to empty str
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || '' }}
      # Hardcoded literals, not from a secret/variable/input — CI must never be able to run IBKR in
      # live mode, even if a future test starts exercising real Gateway connectivity (it doesn't
      # today). Only ever add TWS_USERID_PAPER/TWS_PASSWORD_PAPER as repo secrets, never the live pair.
      # Both names are pinned: IBKR_TRADING_MODE is what our own code (ibkr_config.py) reads;
      # TRADING_MODE is the literal env var name ib-gateway's own image requires, in case a future
      # workflow ever brings that container up directly via docker compose.
      IBKR_TRADING_MODE: paper
      TRADING_MODE: paper
      # Add additional token options here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Validate Python version match
        run: ./scripts/validate_python_version.sh

      - name: Install project dependencies
        run: just install-dev

      - name: Run format + type checks no fixes
        run: just lint-ci

      - name: Run tests
        run: just test

      - name: Clean up
        run: just clean-data
  docker:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Export build versions
        run: bash scripts/export_build_versions.sh --github-env >> "$GITHUB_ENV"

      - name: Build images
        run: just docker-build
